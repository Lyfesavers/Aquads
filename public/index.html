    <!--
      WebSite structured data — this is the signal Google's site name system
      reads to decide what to print above search results ("Aquads" instead of
      the bare "aquads.xyz" domain). It lives in the static shell rather than
      React Helmet so Googlebot sees it in the raw HTML of the domain root
      without having to render the lazy-loaded landing page bundle first.
      Keep `name` byte-identical to og:site_name, the <title> brand segment,
      and the visible logo alt text — mismatches make Google fall back to the
      domain. There must be exactly one WebSite block on the home page, so do
      not re-add one in LandingPage.js.
      SearchAction is kept for Bing (Google deprecated the sitelinks search box
      in Nov 2024 but still parses the block fine).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.aquads.xyz/#website",
        "name": "Aquads",
        "url": "https://www.aquads.xyz/",
        "inLanguage": "en",
        "description": "The post-launch growth stack for crypto projects—list, grow, hire, and get paid after the token is live.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.aquads.xyz/marketplace?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
